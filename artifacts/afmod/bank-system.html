<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>البنك الشخصي | عرب فيرست</title>
  <link rel="icon" type="image/png" href="afmod-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --phone-w: 390px;
      --phone-r: 54px;
      --gold: #d4af37;
      --gold2: #f0d060;
      --navy: #0a1a3d;
      --navy2: #050f29;
      --surface: rgba(255,255,255,0.05);
      --border: rgba(212,175,55,0.15);
      --text: #e8e0d0;
      --muted: rgba(232,224,208,0.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100dvh; font-family: 'Reem Kufi','Noto Kufi Arabic',sans-serif; background: #030810; color: var(--text); overflow-x: hidden; }
    body { display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; position: relative; }

    /* back link */
    .back-link { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 50; display: flex; align-items: center; gap: .4rem; color: var(--gold); font-size: .82rem; font-weight: 600; text-decoration: none; background: rgba(0,0,0,.4); border: 1px solid rgba(212,175,55,.2); border-radius: 20px; padding: .35rem .85rem; backdrop-filter: blur(8px); transition: background .15s; }
    .back-link:hover { background: rgba(212,175,55,.1); }
    .back-link svg { width: 14px; height: 14px; }

    /* phone shell */
    .phone-wrap { position: relative; width: 100%; max-width: var(--phone-w); margin: 0 auto; }
    .phone-shell {
      position: relative;
      width: 100%;
      background: #0b0e18;
      border-radius: var(--phone-r);
      border: 1.5px solid rgba(255,255,255,0.12);
      box-shadow:
        0 0 0 7px rgba(255,255,255,0.04),
        0 0 0 8px rgba(255,255,255,0.02),
        0 40px 120px rgba(0,0,0,0.9),
        inset 0 1px 0 rgba(255,255,255,0.08);
      overflow: hidden;
    }

    /* dynamic island */
    .dynamic-island {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: 126px; height: 37px; background: #000;
      border-radius: 20px; z-index: 10;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
    }
    .di-camera { width: 12px; height: 12px; border-radius: 50%; background: #111; border: 1.5px solid rgba(255,255,255,0.05); }
    .di-speaker { width: 56px; height: 5px; background: #111; border-radius: 3px; }

    /* status bar */
    .status-bar { padding: 58px 22px 8px; display: flex; justify-content: space-between; align-items: center; font-size: .75rem; font-weight: 600; color: rgba(255,255,255,0.85); }
    .status-time { font-size: .88rem; font-weight: 700; }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .status-icons svg { width: 16px; height: 16px; }

    /* screen content */
    .screen { padding: 0; background: linear-gradient(160deg, #0b1020 0%, #060d1a 100%); min-height: 780px; display: flex; flex-direction: column; }

    /* app header */
    .app-header { padding: .75rem 1.25rem 0; display: flex; align-items: center; justify-content: space-between; }
    .app-header-title { font-size: 1.55rem; font-weight: 900; color: #fff; }
    .app-header-sub { font-size: .72rem; color: var(--muted); margin-top: .1rem; }
    .app-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,var(--gold),#b8942e); display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 800; color: #0a0800; flex-shrink: 0; }

    /* balance card */
    .balance-card {
      margin: 1rem 1rem 0;
      padding: 1.5rem 1.5rem 1.6rem;
      border-radius: 28px;
      background: linear-gradient(135deg, #1a2a5e 0%, #0e1a40 60%, #0a1228 100%);
      border: 1px solid rgba(212,175,55,0.25);
      position: relative; overflow: hidden;
    }
    .balance-card::before {
      content: ""; position: absolute; top: -40%; right: -20%;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(212,175,55,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .balance-card::after {
      content: ""; position: absolute; bottom: -30%; left: -10%;
      width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(56,189,248,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .balance-label { font-size: .72rem; font-weight: 600; color: rgba(212,175,55,.7); letter-spacing: .1em; text-transform: uppercase; margin-bottom: .5rem; }
    .balance-amount { font-size: 2.4rem; font-weight: 900; color: #fff; letter-spacing: -.02em; line-height: 1; }
    .balance-amount .currency { font-size: 1.1rem; font-weight: 600; color: var(--gold); margin-left: .15rem; vertical-align: super; font-size: .9rem; }
    .balance-refresh { display: inline-flex; align-items: center; gap: .35rem; margin-top: .8rem; font-size: .75rem; color: rgba(212,175,55,.6); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
    .balance-refresh svg { width: 13px; height: 13px; }
    .balance-refresh:hover { color: var(--gold); }
    .balance-loading { display: inline-block; width: 90px; height: 2.4rem; background: rgba(255,255,255,.07); border-radius: 10px; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* quick actions */
    .quick-actions { display: flex; gap: .75rem; padding: 1rem 1rem 0; }
    .q-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: .4rem;
      padding: .85rem .5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,175,55,0.12);
      border-radius: 18px; cursor: pointer; font-family: inherit;
      color: var(--text); transition: background .15s, border-color .15s;
    }
    .q-btn:hover { background: rgba(212,175,55,.08); border-color: rgba(212,175,55,.3); }
    .q-btn svg { width: 22px; height: 22px; color: var(--gold); }
    .q-btn span { font-size: .72rem; font-weight: 600; color: var(--muted); }

    /* section title */
    .section-title { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; padding: 1.1rem 1.25rem .5rem; }

    /* transfer sheet */
    .transfer-sheet { margin: 0 1rem; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 20px; padding: 1.1rem 1.1rem 1.25rem; }
    .t-label { font-size: .73rem; color: var(--muted); font-weight: 600; margin-bottom: .3rem; }
    .t-input {
      width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(212,175,55,.15);
      border-radius: 12px; color: #d8eaf5; font-size: .92rem; padding: .6rem .9rem;
      font-family: inherit; outline: none; transition: border-color .15s; margin-bottom: .7rem;
    }
    .t-input:focus { border-color: rgba(212,175,55,.45); }
    .t-row { display: flex; gap: .6rem; }
    .t-row .t-input { margin-bottom: 0; }
    .t-note { flex: 1; }
    .t-amount-wrap { position: relative; flex: 0 0 130px; }
    .t-amount-wrap .t-input { padding-right: 2rem; }
    .t-dollar { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); color: var(--gold); font-weight: 700; font-size: .9rem; }
    .t-submit {
      width: 100%; margin-top: .8rem;
      padding: .7rem;
      background: linear-gradient(135deg,#d4af37,#b8942e);
      color: #0a0800; font-size: .9rem; font-weight: 800;
      border: none; border-radius: 14px; cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    .t-submit:hover { opacity: .85; }
    .t-submit:disabled { opacity: .45; cursor: not-allowed; }
    .t-feedback { font-size: .78rem; margin-top: .45rem; text-align: center; min-height: 1.1rem; }
    .t-feedback.ok { color: #22c55e; }
    .t-feedback.err { color: #ef4444; }

    /* transaction log */
    .log-list { padding: 0 1rem 2rem; display: flex; flex-direction: column; gap: .5rem; }
    .log-item {
      display: flex; align-items: center; gap: .85rem;
      background: rgba(255,255,255,.03); border: 1px solid rgba(212,175,55,.07);
      border-radius: 14px; padding: .7rem .9rem;
    }
    .log-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .log-icon svg { width: 18px; height: 18px; }
    .log-icon.out { background: rgba(239,68,68,.1); color: #ef4444; }
    .log-icon.in  { background: rgba(34,197,94,.1);  color: #22c55e; }
    .log-icon.buy { background: rgba(212,175,55,.1);  color: var(--gold); }
    .log-info { flex: 1; min-width: 0; }
    .log-name { font-size: .85rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-meta { font-size: .72rem; color: var(--muted); margin-top: .12rem; }
    .log-amount { font-size: .92rem; font-weight: 800; white-space: nowrap; }
    .log-amount.out { color: #ef4444; }
    .log-amount.in  { color: #22c55e; }
    .log-empty { text-align: center; color: var(--muted); font-size: .85rem; padding: 2rem 0; }

    /* home indicator */
    .home-indicator { height: 34px; display: flex; align-items: center; justify-content: center; }
    .home-bar { width: 134px; height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; }

    /* page loading overlay */
    .page-loading { position: fixed; inset: 0; background: #030810; display: flex; align-items: center; justify-content: center; z-index: 999; }
    .page-loading .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(212,175,55,.2); border-top-color: var(--gold); animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* spin for refresh */
    .spin-anim { animation: spin .7s linear infinite; }
  </style>
  <script>(function(){function _b(e){if(e.key==="F12"){e.preventDefault();return false;}if(e.ctrlKey&&e.shiftKey&&["i","I","j","J","c","C"].indexOf(e.key)!==-1){e.preventDefault();return false;}if(e.ctrlKey&&["u","U","s","S","p","P"].indexOf(e.key)!==-1){e.preventDefault();return false;}}document.addEventListener("contextmenu",function(e){e.preventDefault();},true);document.addEventListener("keydown",_b,true);})();</script>
</head>
<body>

  <div id="page-loading" class="page-loading"><div class="spinner"></div></div>

  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    الرئيسية
  </a>

  <div class="phone-wrap">
    <div class="phone-shell">
      <!-- Dynamic Island -->
      <div class="dynamic-island">
        <div class="di-camera"></div>
        <div class="di-speaker"></div>
        <div class="di-camera"></div>
      </div>

      <div class="screen" id="screen">
        <!-- Status bar -->
        <div class="status-bar">
          <div class="status-time" id="status-time">9:41</div>
          <div class="status-icons">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1.5 8.5a13 13 0 0 1 21 0M5 12a10 10 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0M12 19h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px"><rect x="1" y="6" width="15" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M23 10v4a2 2 0 0 1 0-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="2" y="7" width="10" height="10" rx="1" fill="currentColor"/></svg>
          </div>
        </div>

        <!-- App Header -->
        <div class="app-header">
          <div>
            <div class="app-header-title">البنك الشخصي</div>
            <div class="app-header-sub">Personal Banking — Arab First</div>
          </div>
          <div class="app-avatar" id="user-avatar">?</div>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
          <div class="balance-label">رصيدك الحالي</div>
          <div class="balance-amount" id="balance-display">
            <span id="balance-loading" class="balance-loading"></span>
          </div>
          <button class="balance-refresh" id="balance-refresh-btn" onclick="loadBalance()">
            <svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            تحديث الرصيد
          </button>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
          <button class="q-btn" onclick="scrollToTransfer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            <span>تحويل</span>
          </button>
          <button class="q-btn" onclick="loadLog()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>كشف حساب</span>
          </button>
        </div>

        <!-- Transfer Section -->
        <div class="section-title" id="transfer-section">تحويل الأموال</div>
        <div class="transfer-sheet">
          <div class="t-label">يوزر ديسكورد المستلم</div>
          <input type="text" class="t-input" id="t-to" placeholder="@username" autocomplete="off" autocorrect="off" />
          <div class="t-row">
            <div class="t-amount-wrap">
              <span class="t-dollar">$</span>
              <input type="number" class="t-input" id="t-amount" placeholder="0" min="1" step="1" />
            </div>
            <input type="text" class="t-input t-note" id="t-note" placeholder="ملاحظة (اختياري)" maxlength="100" />
          </div>
          <button class="t-submit" id="t-submit" onclick="doTransfer()">تحويل الآن</button>
          <div class="t-feedback" id="t-feedback"></div>
        </div>

        <!-- Log Section -->
        <div class="section-title">كشف الحساب البنكي</div>
        <div class="log-list" id="log-list">
          <div class="log-empty">جاري التحميل…</div>
        </div>

        <!-- Home indicator -->
        <div class="home-indicator"><div class="home-bar"></div></div>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
  (function () {
    function fmt(n) { return "$" + Number(n).toLocaleString("en-US"); }
    function timeAgo(ts) {
      var d = new Date(ts), now = Date.now(), diff = Math.floor((now - d.getTime()) / 1000);
      if (diff < 60) return "الآن";
      if (diff < 3600) return Math.floor(diff / 60) + " دقيقة";
      if (diff < 86400) return Math.floor(diff / 3600) + " ساعة";
      return d.toLocaleDateString("ar-SA", { month: "short", day: "numeric" });
    }

    // clock
    function updateClock() {
      var now = new Date(), h = now.getHours(), m = now.getMinutes();
      document.getElementById("status-time").textContent = h + ":" + (m < 10 ? "0" : "") + m;
    }
    updateClock(); setInterval(updateClock, 10000);

    // auth
    window.afApi.me().then(function (me) {
      if (!me || !me.id) { location.replace("/"); return; }
      var av = document.getElementById("user-avatar");
      av.textContent = (me.displayName || me.username || "?").charAt(0).toUpperCase();
      document.getElementById("page-loading").style.display = "none";
      loadBalance();
      loadLog();
    }).catch(function () { location.replace("/"); });

    // balance
    window.loadBalance = function () {
      var el = document.getElementById("balance-display");
      var icon = document.getElementById("refresh-icon");
      el.innerHTML = '<span class="balance-loading"></span>';
      icon.classList.add("spin-anim");
      window.afApi._fetch("/api/bank-system/balance").then(function (d) {
        var balance = d.balance ?? d.cash ?? d.amount ?? d.wallet ?? null;
        if (balance !== null && balance !== undefined) {
          el.innerHTML = '<span class="currency">$</span>' + Number(balance).toLocaleString("en-US");
        } else {
          el.innerHTML = '<span style="font-size:1rem;color:var(--muted)">تعذّر جلب الرصيد</span>';
        }
      }).catch(function () {
        el.innerHTML = '<span style="font-size:1rem;color:var(--muted)">تعذّر الاتصال</span>';
      }).finally(function () { icon.classList.remove("spin-anim"); });
    };

    function scrollToTransfer() {
      document.getElementById("transfer-section").scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(function () { document.getElementById("t-to").focus(); }, 400);
    }
    window.scrollToTransfer = scrollToTransfer;

    // transfer
    window.doTransfer = function () {
      var toVal = (document.getElementById("t-to").value || "").trim().replace(/^@/, "");
      var amt   = Number(document.getElementById("t-amount").value);
      var note  = (document.getElementById("t-note").value || "").trim();
      var fb    = document.getElementById("t-feedback");
      var btn   = document.getElementById("t-submit");

      fb.textContent = ""; fb.className = "t-feedback";
      if (!toVal) { fb.textContent = "أدخل يوزر المستلم"; fb.className = "t-feedback err"; return; }
      if (!amt || amt < 1) { fb.textContent = "أدخل مبلغاً صحيحاً"; fb.className = "t-feedback err"; return; }

      btn.disabled = true; btn.textContent = "جاري التحويل…";
      window.afApi._fetch("/api/bank-system/transfer", {
        method: "POST",
        body: JSON.stringify({ toUsername: toVal, amount: Math.floor(amt), note: note }),
      }).then(function (d) {
        fb.className = "t-feedback ok";
        fb.textContent = "✓ تم التحويل " + fmt(d.amount) + " إلى @" + d.toUsername;
        document.getElementById("t-to").value = "";
        document.getElementById("t-amount").value = "";
        document.getElementById("t-note").value = "";
        loadBalance();
        loadLog();
      }).catch(function (err) {
        fb.className = "t-feedback err";
        fb.textContent = (err && err.message) ? err.message : "تعذّر التحويل";
      }).finally(function () {
        btn.disabled = false; btn.textContent = "تحويل الآن";
      });
    };

    // log
    window.loadLog = function () {
      var list = document.getElementById("log-list");
      list.innerHTML = '<div class="log-empty">جاري التحميل…</div>';
      window.afApi._fetch("/api/bank-system/log").then(function (entries) {
        if (!entries || !entries.length) {
          list.innerHTML = '<div class="log-empty">لا توجد معاملات بعد</div>';
          return;
        }
        list.innerHTML = "";
        entries.forEach(function (e) {
          var item = document.createElement("div");
          item.className = "log-item";
          var iconCls, iconSvg, label, dirCls;
          if (e.type === "transfer_out") {
            iconCls = "out"; dirCls = "out";
            label = "تحويل إلى @" + e.counterpart;
            iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
          } else if (e.type === "transfer_in") {
            iconCls = "in"; dirCls = "in";
            label = "استلام من @" + e.counterpart;
            iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>';
          } else {
            iconCls = "buy"; dirCls = "out";
            label = "شراء — " + (e.note || e.counterpart);
            iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
          }
          var amtText = (dirCls === "out" ? "−" : "+") + fmt(e.amount);
          item.innerHTML =
            '<div class="log-icon ' + iconCls + '">' + iconSvg + '</div>' +
            '<div class="log-info"><div class="log-name">' + label + '</div><div class="log-meta">' + (e.note && e.type !== "purchase" ? e.note + " · " : "") + timeAgo(e.at) + '</div></div>' +
            '<div class="log-amount ' + dirCls + '">' + amtText + '</div>';
          list.appendChild(item);
        });
      }).catch(function () {
        list.innerHTML = '<div class="log-empty">تعذّر تحميل كشف الحساب</div>';
      });
    };

    // patch afApi to expose _fetch
    if (!window.afApi._fetch) {
      window.afApi._fetch = function (url, opts) {
        return fetch(url, Object.assign({ credentials: "include", headers: { "Content-Type": "application/json" } }, opts))
          .then(function (r) {
            return r.json().then(function (d) {
              if (!r.ok) { var e = new Error(d.message || d.error || "error"); e.data = d; throw e; }
              return d;
            });
          });
      };
    }

  })();
  </script>
</body>
</html>
